name: CICDPractice
options:
  bundleIdPrefix: com.sanjana
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your own team ID in Xcode (Signing & Capabilities) before running on a device.
    DEVELOPMENT_TEAM: ""

targets:
  CICDPractice:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sanjana.CICDPractice
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: CICD Practice
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    scheme:
      testTargets:
        - CICDPracticeTests

  CICDPracticeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: CICDPractice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sanjana.CICDPractice.tests
        TEST_TARGET_NAME: CICDPractice
        GENERATE_INFOPLIST_FILE: YES
